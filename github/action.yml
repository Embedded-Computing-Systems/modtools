name: "MOD GitHub Action"
description: "Run MOD in GitHub Actions workflows"
...
  share:
    description: "Share the MOD session (defaults to true for public repos)"
...
  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of MOD App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
...
  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/mod,/oc'"
...
    - name: Get MOD version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/anomalyco/modtools/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache MOD
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.mod/bin
        key: mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install MOD
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://modtools.ai/install | bash

    - name: Add MOD to PATH
      shell: bash
      run: echo "$HOME/.mod/bin" >> $GITHUB_PATH

    - name: Run MOD
      shell: bash
      id: run_mod
      run: mod github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
