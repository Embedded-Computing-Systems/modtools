name: modtools

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  modtools:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /modtools') ||
      startsWith(github.event.comment.body, '/modtools')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run modtools
        uses: Embedded-Computing-Systems/modtools/github@latest
        env:
          MOD_API_KEY: ${{ secrets.MOD_API_KEY }}
          MOD_PERMISSION: '{"bash": "deny"}'
        with:
          model: modtools/claude-opus-4-5
